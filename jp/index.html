<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- 사진·CSS·JS는 상위 폴더(한국어판)의 파일을 같이 씀 -->
  <base href="../" />
  <title>キム・ジュンホ ♥ 東 夏穂 結婚式のご案内</title>
  <meta name="description" content="2027年1月23日（土）午後5時、パーティウムハウス水原" />

  <!-- LINE·カカオトーク リンクプレビュー -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="キム・ジュンホ ♥ 東 夏穂 結婚式のご案内" />
  <meta property="og:description" content="2027年1月23日（土）午後5時" />
  <meta property="og:image" content="https://junkth02.github.io/wed/images/og.jpg" />
  <meta property="og:url" content="https://junkth02.github.io/wed/jp/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Zen+Kaku+Gothic+New&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <main class="card">

    <!-- カバー -->
    <section class="cover">
      <p class="cover-date" id="coverDate"></p>
      <div class="cover-photo"><img id="coverImg" alt="カバー写真" /></div>
      <h1 class="cover-names"><span data-groom></span><i>&amp;</i><span data-bride></span></h1>
      <p class="cover-venue" id="coverVenue"></p>
    </section>

    <!-- ご挨拶 -->
    <section class="section fade">
      <p class="eyebrow">INVITATION</p>
      <h2 id="greetTitle"></h2>
      <p class="greeting" id="greetMsg"></p>
      <div class="parents" id="parents"></div>
      <button class="btn-outline" id="contactBtn">連絡する</button>
    </section>

    <!-- カレンダー -->
    <section class="section fade alt">
      <p class="eyebrow">WEDDING DAY</p>
      <p class="date-text" id="dateText"></p>
      <table class="calendar" id="calendar"></table>
      <div class="countdown" id="countdown"></div>
      <p class="dday" id="dday"></p>
    </section>

    <!-- ギャラリー -->
    <section class="section fade">
      <p class="eyebrow">GALLERY</p>
      <h2>ギャラリー</h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <!-- アクセス -->
    <section class="section fade alt">
      <p class="eyebrow">LOCATION</p>
      <h2>アクセス</h2>
      <p class="venue-name" id="venueName"></p>
      <p class="venue-addr" id="venueAddr"></p>
      <div class="map-buttons">
        <a data-map="google" target="_blank" rel="noopener">Google マップ</a>
        <a data-map="naver" target="_blank" rel="noopener">NAVER Map</a>
        <a data-map="kakao" target="_blank" rel="noopener">KakaoMap</a>
      </div>
      <button class="btn-text" id="copyAddr">住所をコピー（タクシー用）</button>
      <dl class="transport" id="transport"></dl>
    </section>

    <!-- シェア -->
    <section class="section share fade">
      <button class="btn-fill" id="shareBtn">招待状をシェア</button>
      <button class="btn-outline" id="copyLink">リンクをコピー</button>
      <p class="footer">Thank you for celebrating with us</p>
    </section>
  </main>

  <!-- ライトボックス -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" aria-label="閉じる">&times;</button>
    <button class="lb-prev" aria-label="前へ">&#8249;</button>
    <img alt="" />
    <button class="lb-next" aria-label="次へ">&#8250;</button>
    <p class="lb-count"></p>
  </div>

  <!-- 連絡先 -->
  <div class="modal" id="contactModal" hidden>
    <div class="modal-box">
      <h3>連絡する</h3>
      <div id="contactList"></div>
      <button class="btn-outline modal-close">閉じる</button>
    </div>
  </div>

  <button class="bgm-btn" id="bgmBtn" hidden aria-label="BGM">♪</button>
  <audio id="bgm" loop></audio>
  <div class="toast" id="toast"></div>

  <script src="config.js?v=5"></script>
  <script src="script.js?v=5"></script>
</body>
</html>
